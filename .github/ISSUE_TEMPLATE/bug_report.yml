name: Bug report
description: Report broken or unexpected behavior
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected to happen as well.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start the game\n2. ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 142, desktop
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Add anything that helps explain the problem.
