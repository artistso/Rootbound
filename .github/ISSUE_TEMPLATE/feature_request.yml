name: Feature or design proposal
description: Propose a focused gameplay or technical improvement
title: "[Proposal] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Goal
      description: What player experience or development problem should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable results would make this complete?
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Related roadmap milestone
      placeholder: M2 — Pressure
