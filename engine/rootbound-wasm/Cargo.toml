[package]
name = "rootbound-wasm"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the Rootbound engine core (JS-callable Engine)."

[lib]
# cdylib for the wasm artifact, rlib so the workspace host build and tests work.
crate-type = ["cdylib", "rlib"]

[dependencies]
rootbound-core = { path = "../rootbound-core" }
# Pinned exactly so the crate and the wasm-bindgen CLI installed in CI
# (`cargo install wasm-bindgen-cli --locked`) cannot drift apart.
wasm-bindgen = "=0.2.100"
